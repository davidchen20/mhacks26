name: Refresh M Dining menus
on:
  schedule:
    - cron: '15 10 * * *' # 05:15 EST / 06:15 EDT, always the Detroit calendar day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-menus
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/scrape_all.py
      - name: Commit menu snapshot
        run: |
          git config user.name 'WolverLean menu bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/scrapedMenus.json lib/scrapeStatus.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh M Dining menus'
            git push
          fi
      - name: Trigger redeploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl --fail --retry 3 --request POST "$DEPLOY_HOOK_URL"
          else
            echo 'Configure DEPLOY_HOOK_URL or a hosting Git integration to deploy menu commits.'
          fi
